# ghidra-headless-mcp in a container.
#
# Binaries to analyse come from SAMPLES_DIR (default ./samples), mounted
# read-only at SAMPLES_MOUNT (default /samples). Point SAMPLES_MOUNT at the path
# another container already uses for the same files -- a devcontainer, say -- and
# one binary path is valid in both, so prompts need not say which side they mean.
#
# Two services run the same image over the same project:
#
#   ghidra-headless-mcp        mcpo, HTTP/OpenAPI on 1341 -- for OpenWebUI
#   ghidra-headless-mcp-http   --http on 1351: native MCP at /mcp, and plain
#                              HTTP/JSON at /api for programs (real status
#                              codes, streamed uploads)
#
# Sharing ./projects-docker is safe: every Ghidra run takes headless.py's
# project lock file, which serialises the two processes as well as the calls
# within each.
#
# Copy .env.example to .env to change any of the defaults below.
name: ghidra-headless-mcp

# Settings both services share, merged into each with <<.
x-server: &server
  image: ghidra-headless-mcp:local
  restart: unless-stopped

services:
  ghidra-headless-mcp:
    <<: *server
    build: .
    container_name: ghidra-headless-mcp
    environment: &environment
      # No default on purpose: `?` makes compose itself refuse to start with a
      # named error, so a missing key fails before the build rather than as a
      # container that crash-loops. Every tool is reachable over this port,
      # run_ghidra_script included.
      # Single-quoted: the ':?' message contains ': ', which YAML would
      # otherwise read as a nested mapping.
      GHMCP_API_KEY: '${GHMCP_API_KEY:?set it in .env, generate with: python3 -c "import secrets; print(secrets.token_urlsafe(32))"}'
      PROJECT_NAME: ${PROJECT_NAME:-headless-mcp}
      ANALYZE_TIMEOUT_S: ${ANALYZE_TIMEOUT_S:-1800}
      QUERY_TIMEOUT_S: ${QUERY_TIMEOUT_S:-600}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-4194304}
      OPENWEBUI_UPLOADS_DIR: ${OPENWEBUI_UPLOADS_DIR:-}
      MAX_STREAM_UPLOAD_BYTES: ${MAX_STREAM_UPLOAD_BYTES:-134217728}
      # Host headers /mcp accepts beyond loopback (the --http service only).
      # The ports below publish on the docker bridge so other containers can
      # reach this one, and they arrive under these names; without them the
      # MCP SDK's DNS-rebinding guard answers 421. /api is not affected.
      GHMCP_ALLOWED_HOSTS: ${GHMCP_ALLOWED_HOSTS:-host.docker.internal,${DOCKER_BRIDGE_IP:-172.17.0.1}}
    ports:
      # Loopback for host-side clients, plus the docker bridge gateway so the
      # other containers on this host reach it at host.docker.internal:1341.
      # Deliberately not 0.0.0.0: run_ghidra_script executes arbitrary Ghidra
      # scripts, so this server has no business being reachable from the LAN.
      - "127.0.0.1:${MCPO_PORT:-1341}:1341"
      - "${DOCKER_BRIDGE_IP:-172.17.0.1}:${MCPO_PORT:-1341}:1341"
    volumes: &volumes
      # The server source, so edits take effect on restart with no rebuild.
      - .:/srv/ghidra-headless-mcp
      # Binaries to analyse, read-only. Defaults to ./samples beside this file;
      # a missing directory would be created root-owned by docker, so it ships.
      - ${SAMPLES_DIR:-./samples}:${SAMPLES_MOUNT:-/samples}:ro
      # Ghidra projects. Kept apart from ./projects, which a host-side run
      # uses: projects are not portable across Ghidra versions.
      - ./projects-docker:/projects
      # Ghidra's per-user state, so it is not rebuilt on every container start.
      - ghidra-user-config:/home/ghidra/.config/ghidra
    healthcheck:
      # Unauthenticated on purpose. --api-key protects the tool endpoints, not
      # the schema, so this needs no token; see serve-mcpo.sh.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:1341/openapi.json"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  ghidra-headless-mcp-http:
    <<: *server
    container_name: ghidra-headless-mcp-http
    # 0.0.0.0 inside the container, for the same reason as MCPO_HOST: loopback
    # here is unreachable through the published port. --http refuses to start
    # without GHMCP_API_KEY, so this fails closed like serve-mcpo.sh.
    command: ["python", "ghidra_headless_mcp.py", "--http", "--host", "0.0.0.0", "--port", "1351"]
    environment: *environment
    ports:
      # The same two addresses as above, never 0.0.0.0. GHMCP_HTTP_PORT moves
      # the published port off 1351 when a host-side --http run holds it.
      - "127.0.0.1:${GHMCP_HTTP_PORT:-1351}:1351"
      - "${DOCKER_BRIDGE_IP:-172.17.0.1}:${GHMCP_HTTP_PORT:-1351}:1351"
    volumes: *volumes
    healthcheck:
      # /healthz is the one unauthenticated path; tool calls run off the event
      # loop, so it answers even while an analysis runs.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:1351/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  ghidra-user-config:

networks:
  default:
    # A fixed name rather than compose's <project>_default, so the network is
    # predictable for docker tooling and anything else that needs to name it.
    # Clients reach the server through its published ports, not by joining
    # this network. Override with GHMCP_NETWORK.
    name: ${GHMCP_NETWORK:-ghidra-headless-mcp}

name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    # The unit suite needs no Ghidra and no sample binaries; the integration
    # suite needs both and is run locally (see README, "Tests").
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q --cov=ghmcp --cov=ghidra_headless_mcp --cov-branch --cov-fail-under=100

  integration:
    # Real Ghidra (12.1.3, the slim image) over the committed fixtures in
    # tests/fixtures/bin. The Windows-layering module needs the course's
    # Windows binaries and skips here.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.slim -t ghidra-headless-mcp:slim .
      - run: >-
          docker run --rm -v "$PWD:/src:ro"
          --tmpfs /work:uid=1000,gid=1000,size=4g
          --tmpfs /projects:uid=1000,gid=1000,size=4g
          --entrypoint sh ghidra-headless-mcp:slim -c
          'cp -r /src /work/code && cd /work/code && python3 -m pytest -q -p no:cacheprovider -m integration -rs'
